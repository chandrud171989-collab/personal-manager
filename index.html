<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#12151a">

<title>Personal Manager</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- =========================
       TOP BAR
  ========================== -->
  <header class="topbar">

    <div class="topbar-brand">
      <span class="brand-mark"></span>
      <span class="brand-name">Personal Manager</span>
    </div>

    <div class="topbar-actions">

      <!-- Notification -->
      <button
        id="notifPermBtn"
        class="icon-btn"
        title="Enable notifications"
        aria-label="Enable notifications">

        <svg viewBox="0 0 24 24" width="20" height="20">
          <path
            fill="currentColor"
            d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6.2V11c0-3.4-1.8-6.2-5-6.9V3a2 2 0 0 0-4 0v1.1C6.8 4.8 5 7.6 5 11v4.8L3 17.8V19h18v-1.2z"/>
        </svg>

      </button>

      <!-- Logout -->
      <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
        title="Logout">

        <span class="logout-icon">↪</span>
        <span>Logout</span>

      </button>

    </div>

  </header>


  <!-- =========================
       MAIN VIEW
  ========================== -->

  <main id="view" class="view"></main>


  <!-- =========================
       ADD BUTTON
       Used only for:
       Documents
       Maintenance
  ========================== -->

  <button
    id="fab"
    class="fab"
    aria-label="Add new"
    type="button">

    <svg viewBox="0 0 24 24" width="26" height="26">
      <path
        fill="currentColor"
        d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/>
    </svg>

  </button>


  <!-- =========================
       BOTTOM NAVIGATION
  ========================== -->

  <nav class="bottomnav">

    <!-- Dashboard -->
    <button
      class="navbtn active"
      data-view="dashboard"
      type="button">

      <svg viewBox="0 0 24 24" width="22" height="22">
        <path
          fill="currentColor"
          d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/>
      </svg>

      <span>Dashboard</span>

    </button>


    <!-- Documents -->
    <button
      class="navbtn"
      data-view="documents"
      type="button">

      <svg viewBox="0 0 24 24" width="22" height="22">
        <path
          fill="currentColor"
          d="M6 2c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/>
      </svg>

      <span>Documents</span>

    </button>


    <!-- Maintenance -->
    <button
      class="navbtn"
      data-view="maintenance"
      type="button">

      <svg viewBox="0 0 24 24" width="22" height="22">
        <path
          fill="currentColor"
          d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6l-3 3-4.3-4.3C.6 7.1 1 10.1 3 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.4-.4.4-1 0-1.4z"/>
      </svg>

      <span>Maintenance</span>

    </button>


    <!-- Finance -->
    <button
      class="navbtn"
      data-view="finance"
      type="button">

      <svg viewBox="0 0 24 24" width="22" height="22">
        <path
          fill="currentColor"
          d="M12 2C6.48 2 2 5.58 2 10c0 3.1 2.1 5.8 5.2 7.1L6 22l5-3.2c.33.03.66.05 1 .05 5.52 0 10-3.58 10-8.85C22 5.58 17.52 2 12 2z"/>
      </svg>

      <span>Finance</span>

    </button>

  </nav>

</div>


<!-- Modal container -->
<div id="modalRoot"></div>


<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="app.js"></script>

</body>
</html>
