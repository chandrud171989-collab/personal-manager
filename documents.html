<script>
/* Load the existing Supabase config without assuming whether the project keeps it
   at the repository root or under /js. This avoids changing the rest of the app. */
(function loadConfig(candidates, done) {
  if (!candidates.length) { done(); return; }
  var src = candidates.shift();
  var s = document.createElement('script');
  s.src = src + '?v=20260827';
  s.onload = function () {
    try {
      if ((typeof supabaseClient !== 'undefined' && supabaseClient?.from) || window.supabaseClient?.from) { done(); return; }
    } catch (_) {}
    loadConfig(candidates, done);
  };
  s.onerror = function () { loadConfig(candidates, done); };
  document.head.appendChild(s);
})(['supabase-config.js','js/supabase-config.js'], function () {
  var s = document.createElement('script');
  s.src = 'documents.js?v=20260827-cloud2';
  document.body.appendChild(s);
});
</script>
